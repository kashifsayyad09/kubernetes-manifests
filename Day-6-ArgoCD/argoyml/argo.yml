apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syed-argo-application
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:kashifsayyad09/kubernetes-manifests.git
    targetRevision: HEAD
    path: Day-6-ArgoCD
  destination: 
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
